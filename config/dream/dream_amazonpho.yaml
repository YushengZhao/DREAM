model:
  method: dream
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

  k_topology: 8
  k_proximity: 17
  temperature: 0.04
  d_max: 0

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 500
  patience: ~
  criterion: metric
  warmup_epochs: 1

  lambda_cl: 0.01
  cl_temperature: 0.5
  warmup_epochs_cl: 30
  drop_edge_rate1: 0.05
  mask_feat_rate1: 0.1
  drop_edge_rate2: 0.1
  mask_feat_rate2: 0.05

dataset:
  name: A-Photo
  sparse: true