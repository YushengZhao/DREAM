model:
  method: dream
  n_hidden: 64
  n_layer: 2
  act: F.relu
  dropout: 0.5
  norm_info: ~
  input_layer: false
  output_layer: false

  k_topology: 10
  k_proximity: 15
  temperature: 0.04
  d_max: 4

training:
  lr: 1e-2
  weight_decay: 5e-4
  n_epochs: 500
  patience: ~
  criterion: metric
  warmup_epochs: 3

  lambda_cl: 0.02
  cl_temperature: 0.5
  warmup_epochs_cl: 70
  drop_edge_rate1: 0.2
  mask_feat_rate1: 0.3
  drop_edge_rate2: 0.3
  mask_feat_rate2: 0.2

dataset:
  name: CiteSeer
  sparse: true